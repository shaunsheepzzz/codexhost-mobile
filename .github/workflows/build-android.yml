name: Build Codex Mobile mTLS Android

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Android version (major.minor.patch)
        required: true
        default: "0.2.3"
        type: string

permissions:
  contents: read

concurrency:
  group: codex-mobile-mtls-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: CodexHostMobile
  DISPLAY_NAME: Codex Mobile mTLS
  APP_ID: io.github.shaunsheepzzz.codexhostmobile

jobs:
  build:
    name: Build CodexHostMobile Android
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ inputs.app_version }}
      APP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned PakePlus Android
        uses: actions/checkout@v4
        with:
          repository: Sjj1024/PakePlus-Android
          ref: 787b9e5ea2da1b2d959485417ffeee62f0d30960
          path: pakeplus
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Codex Mobile app icon
        shell: bash
        run: |
          set -euo pipefail
          icon="docs/assets/app-icon/codex-mobile-app-icon-1024.png"
          test -s "$icon"
          node - "$icon" <<'NODE'
          const fs = require("node:fs");
          const icon = fs.readFileSync(process.argv[2]);
          const png = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
          if (!icon.subarray(0, 8).equals(png)) {
            throw new Error("App icon is not a PNG");
          }
          if (icon.readUInt32BE(16) !== 1024 || icon.readUInt32BE(20) !== 1024) {
            throw new Error("App icon must be 1024x1024");
          }
          NODE
          cp "$icon" pakeplus/app-icon.png
          cmp "$icon" pakeplus/app-icon.png

      - name: Build embedded frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          VITE_APP_VERSION="$APP_VERSION" npm run build
          test -s dist/index.html
          grep -Eq '(src|href)="\./assets/' dist/index.html
          cat > "$RUNNER_TEMP/scan-mobile-assets.cjs" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const allowedUrlPrefixes = [
            "http://www.apple.com/DTDs/",
            "http://www.w3.org/",
            "https://github.com/remarkjs/",
            "https://github.com/syntax-tree/",
            "https://github.com/shaunsheepzzz/codexhost-mobile/releases/",
            "https://api.github.com/repos/shaunsheepzzz/codexhost-mobile/releases/",
            "https://react.dev/errors/",
          ];
          const allowedUrls = new Set([
            "http://host.local:18766/?token=xxx",
            "https://www.pakeplus.com/",
          ]);
          const endpointPatterns = [
            [
              "private or link-local IPv4",
              /(^|[^0-9])((10|127)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|169\.254\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})(?=[:/"'\s]|$)/gi,
            ],
            [
              "loopback, unique-local, or link-local IPv6",
              /\[(::1|f[cd][0-9a-f:]*|fe[89ab][0-9a-f:]*)\](?=[:/"'\s]|$)/gi,
            ],
            [
              "localhost",
              /(https?|wss?):\/\/localhost(?=[:/]|$)/gi,
            ],
          ];
          const credentialPatterns = [
            [
              "query credential",
              /[?&](token|access_token|api[_-]?key|secret|password)=[A-Za-z0-9._~+/%=-]{8,}/gi,
            ],
            [
              "assigned credential",
              /["']?(token|authorization|api[_-]?key|secret|password)["']?\s*[:=]\s*["'][^"'\s]{8,}["']/gi,
            ],
            [
              "bearer credential",
              /\bbearer\s+[A-Za-z0-9._~+\/=-]{12,}/gi,
            ],
            [
              "CODEX_MOBILE_TOKEN credential",
              /CODEX_MOBILE_TOKEN\s*=\s*["']?[A-Za-z0-9._~+\/=-]{8,}/g,
            ],
          ];
          const urlPattern = /(?:https?|wss?):\/\/[^\x00-\x20"'`<>\\]+/g;
          const textExtensions = new Set([
            ".css", ".html", ".js", ".json", ".map", ".plist", ".strings",
            ".svg", ".txt", ".xml",
          ]);

          function collect(target) {
            const stat = fs.statSync(target);
            if (stat.isDirectory()) {
              return fs.readdirSync(target).flatMap((entry) =>
                collect(path.join(target, entry))
              );
            }
            return textExtensions.has(path.extname(target).toLowerCase())
              ? [target]
              : [];
          }

          const files = process.argv.slice(2).flatMap(collect);
          if (files.length === 0) {
            throw new Error("No text assets were found to scan");
          }
          const findings = [];
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            for (const [label, pattern] of [
              ...endpointPatterns,
              ...credentialPatterns,
            ]) {
              for (const match of source.matchAll(pattern)) {
                findings.push(`${file}: ${label}: ${match[0].slice(0, 160)}`);
              }
            }
            for (const match of source.matchAll(urlPattern)) {
              const url = match[0];
              if (
                !allowedUrls.has(url)
                && !allowedUrlPrefixes.some((prefix) => url.startsWith(prefix))
              ) {
                findings.push(`${file}: unexpected fixed URL: ${url.slice(0, 160)}`);
              }
            }
          }
          if (findings.length > 0) {
            console.error(findings.join("\n"));
            process.exit(1);
          }
          NODE
          node "$RUNNER_TEMP/scan-mobile-assets.cjs" dist
          cp -R dist/. pakeplus/scripts/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            pakeplus/**/*.gradle*
            pakeplus/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 不能再带 `tools`：该包已从 Android SDK 仓库移除，sdkmanager 会以
          # “Failed to find package 'tools'” 退出码 1 结束整个步骤。
          # 这里按 PakePlus Android 的 compileSdk/targetSdk 34 与 AGP 8.3.0 显式列出。
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Install ImageMagick
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes imagemagick
          convert --version

      - name: Configure PakePlus for embedded HTML
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          jq \
            --arg name "$APP_NAME" \
            --arg displayName "$DISPLAY_NAME" \
            --arg appid "$APP_ID" \
            --arg version "$APP_VERSION" \
            '
              .name = $name
              | .url = ""
              | .showName = $displayName
              | .appid = $appid
              | .version = $version
              | .desc = "Codex Host Mobile"
              | .isHtml = true
              | .android.name = $name
              | .android.showName = $displayName
              | .android.id = $appid
              | .android.version = $version
              | .android.webUrl = ""
              | .android.desc = "Codex Host Mobile"
              | .android.pubBody = ($displayName + " v" + $version)
              | .android.isHtml = true
              | .android.safeArea = "all"
              | .android.debug = false
              | .phone.internet = true
              | .phone.camera = true
            ' scripts/ppconfig.json > "$RUNNER_TEMP/ppconfig-android.json"
          mv "$RUNNER_TEMP/ppconfig-android.json" scripts/ppconfig.json
          jq -e \
            --arg appid "$APP_ID" \
            --arg version "$APP_VERSION" \
            '
              .android.id == $appid
              and .android.version == $version
              and .android.isHtml == true
              and .android.safeArea == "all"
              and .android.webUrl == ""
              and .phone.internet == true
              and .phone.camera == true
            ' scripts/ppconfig.json > /dev/null
          grep -Fq 'android:usesCleartextTraffic="true"' \
            app/src/main/AndroidManifest.xml

      - name: Install PakePlus dependencies
        working-directory: pakeplus
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: pakeplus
        run: pnpm pp:worker

      - name: Harden and test embedded Android project
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest_path = Path("app/src/main/AndroidManifest.xml")
          android = "http://schemas.android.com/apk/res/android"
          tools = "http://schemas.android.com/tools"
          ET.register_namespace("android", android)
          ET.register_namespace("tools", tools)
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          allowed_permissions = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          }
          for required_permission in (
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          ):
              if not any(
                  child.tag == "uses-permission"
                  and child.get(f"{{{android}}}name") == required_permission
                  for child in root
              ):
                  permission = ET.Element("uses-permission")
                  permission.set(f"{{{android}}}name", required_permission)
                  root.insert(0, permission)
          for child in list(root):
              if child.tag == "uses-permission":
                  name = child.get(f"{{{android}}}name", "")
                  if name not in allowed_permissions:
                      root.remove(child)
              elif child.tag in {"uses-feature", "queries"}:
                  root.remove(child)
          application = root.find("application")
          if application is None:
              raise SystemExit("Android application element is missing")
          application.set(f"{{{android}}}allowBackup", "false")
          application.attrib.pop(f"{{{android}}}dataExtractionRules", None)
          application.attrib.pop(f"{{{android}}}fullBackupContent", None)
          for provider in list(application.findall("provider")):
              if provider.get(f"{{{android}}}authorities", "").endswith(
                  ".fileprovider"
              ):
                  application.remove(provider)
          provider = ET.SubElement(application, "provider")
          provider.set(
              f"{{{android}}}name",
              "androidx.core.content.FileProvider",
          )
          provider.set(
              f"{{{android}}}authorities",
              "${applicationId}.fileprovider",
          )
          provider.set(f"{{{android}}}exported", "false")
          provider.set(f"{{{android}}}grantUriPermissions", "true")
          metadata = ET.SubElement(provider, "meta-data")
          metadata.set(
              f"{{{android}}}name",
              "android.support.FILE_PROVIDER_PATHS",
          )
          metadata.set(
              f"{{{android}}}resource",
              "@xml/update_file_paths",
          )
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          Path("app/src/main/res/xml/update_file_paths.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="updates" path="updates/" />
          </paths>
          """
          )
          for unused_asset in ("vConsole.js", "pppwd.html"):
              Path("app/src/main/assets", unused_asset).unlink(missing_ok=True)

          activity_path = Path(
              "app/src/main/java/com/app/pakeplus/MainActivity.kt"
          )
          activity_source = activity_path.read_text()
          if "enableEdgeToEdge()" not in activity_source:
              raise SystemExit("Pinned PakePlus edge-to-edge setup changed")
          webview_field = "    private lateinit var webView: WebView\n"
          safe_area_field = (
              webview_field
              + "    @Volatile\n"
              + "    private var nativeSafeAreaTopCssPx = 0.0\n"
              + "    @Volatile\n"
              + "    private var realtimeAudioRunning = false\n"
              + "    @Volatile\n"
              + "    private var realtimeAudioMuted = false\n"
              + "    private var realtimeAudioRecord: android.media.AudioRecord? = null\n"
              + "    private var realtimeAudioThread: Thread? = null\n"
          )
          original_insets = "\n".join((
              "            val systemBar = insets.getInsets(WindowInsetsCompat.Type.systemBars())",
              "            view.setPadding(systemBar.left, systemBar.top, systemBar.right, systemBar.bottom)",
              "            insets",
          ))
          edge_to_edge_insets = "\n".join((
              "            val systemBar = insets.getInsets(WindowInsetsCompat.Type.systemBars())",
              "            nativeSafeAreaTopCssPx =",
              "                systemBar.top / resources.displayMetrics.density.toDouble()",
              "            view.setPadding(systemBar.left, 0, systemBar.right, systemBar.bottom)",
              "            val insetWebView = view.findViewById<WebView>(R.id.webview)",
              "            val cssTop = nativeSafeAreaTopCssPx",
              "            insetWebView.post {",
              "                insetWebView.evaluateJavascript(",
              "                    \"document.documentElement.style.setProperty('--native-safe-area-top', '${cssTop}px')\",",
              "                    null",
              "                )",
              "            }",
              "            insets",
          ))
          js_interface_anchor = "        // 判断是不是安卓客户端\n"
          safe_area_interface = "\n".join((
              "        @JavascriptInterface",
              "        fun safeAreaTopCssPx(): Double {",
              "            return this@MainActivity.nativeSafeAreaTopCssPx",
              "        }",
              "",
              "        @JavascriptInterface",
              "        fun appVersion(): String {",
              "            @Suppress(\"DEPRECATION\")",
              "            return this@MainActivity.packageManager",
              "                .getPackageInfo(this@MainActivity.packageName, 0)",
              "                .versionName ?: \"0.0.0\"",
              "        }",
              "",
              "        @JavascriptInterface",
              "        fun installApk(downloadUrl: String, sha256: String) {",
              "            AppUpdater(",
              "                this@MainActivity,",
              "                this@MainActivity::emitAppUpdate",
              "            ).install(downloadUrl, sha256)",
              "        }",
              "",
              "        @JavascriptInterface",
              "        fun realtimeAudioStart() {",
              "            this@MainActivity.startRealtimeAudioWithPermission()",
              "        }",
              "",
              "        @JavascriptInterface",
              "        fun realtimeAudioStop() {",
              "            this@MainActivity.stopRealtimeAudio()",
              "        }",
              "",
              "        @JavascriptInterface",
              "        fun realtimeAudioSetMuted(muted: Boolean) {",
              "            this@MainActivity.realtimeAudioMuted = muted",
              "        }",
              "",
              "",
          ))
          interface_doc_anchor = "\n".join((
              "    /**",
              "     * JS 调用的接口",
              "     */",
              "    inner class JsInterface",
          ))
          update_event_helper = "\n".join((
              "    private fun emitAppUpdate(",
              "        phase: String,",
              "        progress: Int?,",
              "        error: String?,",
              "    ) {",
              "        val detail = JSONObject().put(\"phase\", phase)",
              "        if (progress != null) detail.put(\"progress\", progress)",
              "        if (error != null) detail.put(\"error\", error)",
              "        runOnUiThread {",
              "            webView.evaluateJavascript(",
              "                \"window.dispatchEvent(new CustomEvent('codex-mobile-app-update',{detail:${detail}}))\",",
              "                null,",
              "            )",
              "        }",
              "    }",
              "",
              "    private fun emitRealtimeAudio(detail: JSONObject) {",
              "        runOnUiThread {",
              "            webView.evaluateJavascript(",
              "                \"window.dispatchEvent(new CustomEvent('codex-mobile-realtime-audio',{detail:${detail}}))\",",
              "                null,",
              "            )",
              "        }",
              "    }",
              "",
              "    private fun startRealtimeAudioWithPermission() {",
              "        runOnUiThread {",
              "            if (",
              "                androidx.core.content.ContextCompat.checkSelfPermission(",
              "                    this,",
              "                    Manifest.permission.RECORD_AUDIO,",
              "                ) == android.content.pm.PackageManager.PERMISSION_GRANTED",
              "            ) {",
              "                startRealtimeAudio()",
              "            } else {",
              "                androidx.core.app.ActivityCompat.requestPermissions(",
              "                    this,",
              "                    arrayOf(Manifest.permission.RECORD_AUDIO),",
              "                    5102,",
              "                )",
              "            }",
              "        }",
              "    }",
              "",
              "    override fun onRequestPermissionsResult(",
              "        requestCode: Int,",
              "        permissions: Array<out String>,",
              "        grantResults: IntArray,",
              "    ) {",
              "        super.onRequestPermissionsResult(requestCode, permissions, grantResults)",
              "        if (requestCode != 5102) return",
              "        if (",
              "            grantResults.firstOrNull() ==",
              "                android.content.pm.PackageManager.PERMISSION_GRANTED",
              "        ) {",
              "            startRealtimeAudio()",
              "        } else {",
              "            emitRealtimeAudio(",
              "                JSONObject()",
              "                    .put(\"type\", \"error\")",
              "                    .put(\"message\", \"麦克风权限未授权\")",
              "            )",
              "        }",
              "    }",
              "",
              "    @SuppressLint(\"MissingPermission\")",
              "    private fun startRealtimeAudio() {",
              "        if (realtimeAudioRunning) return",
              "        val sampleRate = 24_000",
              "        val channel = android.media.AudioFormat.CHANNEL_IN_MONO",
              "        val encoding = android.media.AudioFormat.ENCODING_PCM_16BIT",
              "        val minimum = android.media.AudioRecord.getMinBufferSize(",
              "            sampleRate, channel, encoding",
              "        )",
              "        if (minimum <= 0) {",
              "            emitRealtimeAudio(",
              "                JSONObject().put(\"type\", \"error\")",
              "                    .put(\"message\", \"无法初始化麦克风\")",
              "            )",
              "            return",
              "        }",
              "        val recorder = android.media.AudioRecord(",
              "            android.media.MediaRecorder.AudioSource.VOICE_RECOGNITION,",
              "            sampleRate,",
              "            channel,",
              "            encoding,",
              "            maxOf(minimum, 4_800),",
              "        )",
              "        if (recorder.state != android.media.AudioRecord.STATE_INITIALIZED) {",
              "            recorder.release()",
              "            emitRealtimeAudio(",
              "                JSONObject().put(\"type\", \"error\")",
              "                    .put(\"message\", \"麦克风初始化失败\")",
              "            )",
              "            return",
              "        }",
              "        realtimeAudioRecord = recorder",
              "        realtimeAudioMuted = false",
              "        realtimeAudioRunning = true",
              "        recorder.startRecording()",
              "        emitRealtimeAudio(JSONObject().put(\"type\", \"started\"))",
              "        realtimeAudioThread = kotlin.concurrent.thread(",
              "            name = \"codex-mobile-realtime-audio\"",
              "        ) {",
              "            val samples = ShortArray(2_400)",
              "            while (realtimeAudioRunning) {",
              "                val count = recorder.read(samples, 0, samples.size)",
              "                if (count <= 0 || realtimeAudioMuted) continue",
              "                val bytes = ByteArray(count * 2)",
              "                for (index in 0 until count) {",
              "                    val value = samples[index].toInt()",
              "                    bytes[index * 2] = (value and 0xff).toByte()",
              "                    bytes[index * 2 + 1] = ((value shr 8) and 0xff).toByte()",
              "                }",
              "                emitRealtimeAudio(",
              "                    JSONObject()",
              "                        .put(\"type\", \"chunk\")",
              "                        .put(",
              "                            \"data\",",
              "                            android.util.Base64.encodeToString(",
              "                                bytes, android.util.Base64.NO_WRAP",
              "                            ),",
              "                        )",
              "                        .put(\"sampleRate\", sampleRate)",
              "                        .put(\"numChannels\", 1)",
              "                        .put(\"samplesPerChannel\", count)",
              "                )",
              "            }",
              "        }",
              "    }",
              "",
              "    private fun stopRealtimeAudio() {",
              "        realtimeAudioRunning = false",
              "        val recorder = realtimeAudioRecord",
              "        realtimeAudioRecord = null",
              "        try { recorder?.stop() } catch (_: IllegalStateException) {}",
              "        recorder?.release()",
              "        realtimeAudioThread = null",
              "        emitRealtimeAudio(JSONObject().put(\"type\", \"stopped\"))",
              "    }",
              "",
              interface_doc_anchor,
          ))
          if activity_source.count(webview_field) != 1:
              raise SystemExit("Pinned PakePlus WebView field changed")
          if activity_source.count(original_insets) != 1:
              raise SystemExit("Pinned PakePlus system-bar inset hook changed")
          if activity_source.count(js_interface_anchor) != 1:
              raise SystemExit("Pinned PakePlus JavaScript interface changed")
          if activity_source.count(interface_doc_anchor) != 1:
              raise SystemExit("Pinned PakePlus interface declaration changed")
          activity_path.write_text(
              activity_source
              .replace(
                  webview_field,
                  safe_area_field,
                  1,
              )
              .replace(
                  original_insets,
                  edge_to_edge_insets,
                  1,
              )
              .replace(
                  js_interface_anchor,
                  safe_area_interface + js_interface_anchor,
                  1,
              )
              .replace(
                  interface_doc_anchor,
                  update_event_helper,
                  1,
              )
          )

          Path(
              "app/src/main/java/com/app/pakeplus/AppUpdater.kt"
          ).write_text(
              r'''package com.app.pakeplus

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.security.MessageDigest
          import kotlin.concurrent.thread

          class AppUpdater(
              private val activity: MainActivity,
              private val emit: (String, Int?, String?) -> Unit,
          ) {
              private val allowedPrefix =
                  "https://github.com/shaunsheepzzz/codexhost-mobile/releases/download/"
              private val allowedRedirectHosts = setOf(
                  "github.com",
                  "objects.githubusercontent.com",
                  "release-assets.githubusercontent.com",
              )

              fun install(downloadUrl: String, sha256: String) {
                  if (
                      !downloadUrl.startsWith(allowedPrefix)
                      || !downloadUrl.matches(Regex(""".+/CodexHostMobile-v\d+\.\d+\.\d+\.apk"""))
                      || !sha256.matches(Regex("""[a-fA-F0-9]{64}"""))
                  ) {
                      emit("error", null, "更新地址或摘要无效")
                      return
                  }
                  thread(name = "codex-mobile-update") {
                      try {
                          downloadAndInstall(downloadUrl, sha256.lowercase())
                      } catch (error: Exception) {
                          emit("error", null, error.message ?: "下载更新失败")
                      }
                  }
              }

              private fun downloadAndInstall(downloadUrl: String, sha256: String) {
                  val connection = URL(downloadUrl).openConnection() as HttpURLConnection
                  connection.instanceFollowRedirects = true
                  connection.connectTimeout = 15_000
                  connection.readTimeout = 30_000
                  connection.setRequestProperty("Accept", "application/vnd.android.package-archive")
                  connection.connect()
                  if (
                      connection.responseCode !in 200..299
                      || connection.url.protocol != "https"
                      || connection.url.host !in allowedRedirectHosts
                  ) {
                      throw IllegalStateException(
                          "下载更新失败（HTTP ${connection.responseCode}）"
                      )
                  }

                  val updates = File(activity.cacheDir, "updates").apply { mkdirs() }
                  val apk = File(updates, "CodexHostMobile-update.apk")
                  val digest = MessageDigest.getInstance("SHA-256")
                  val total = connection.contentLengthLong
                  var downloaded = 0L
                  var lastProgress = -1
                  connection.inputStream.use { input ->
                      apk.outputStream().use { output ->
                          val buffer = ByteArray(DEFAULT_BUFFER_SIZE)
                          while (true) {
                              val count = input.read(buffer)
                              if (count < 0) break
                              output.write(buffer, 0, count)
                              digest.update(buffer, 0, count)
                              downloaded += count
                              val progress =
                                  if (total > 0) ((downloaded * 100) / total).toInt()
                                  else 0
                              if (progress != lastProgress) {
                                  lastProgress = progress
                                  emit("downloading", progress, null)
                              }
                          }
                      }
                  }
                  connection.disconnect()
                  emit("verifying", null, null)
                  val actual = digest.digest().joinToString("") { "%02x".format(it) }
                  if (!actual.equals(sha256, ignoreCase = true)) {
                      apk.delete()
                      throw SecurityException("安装包校验失败")
                  }
                  openInstaller(apk)
              }

              private fun openInstaller(apk: File) {
                  activity.runOnUiThread {
                      if (
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          && !activity.packageManager.canRequestPackageInstalls()
                      ) {
                          activity.startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                  Uri.parse("package:${activity.packageName}"),
                              )
                          )
                          emit("error", null, "请允许 Codex Host Mobile 安装未知应用后重试")
                          return@runOnUiThread
                      }
                      val uri = FileProvider.getUriForFile(
                          activity,
                          "${activity.packageName}.fileprovider",
                          apk,
                      )
                      emit("installing", null, null)
                      activity.startActivity(
                          Intent(Intent.ACTION_VIEW).apply {
                              setDataAndType(
                                  uri,
                                  "application/vnd.android.package-archive",
                              )
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          }
                      )
                  }
              }
          }
          '''.replace("\n          ", "\n").lstrip()
          )

          gradle_path = Path("app/build.gradle.kts")
          gradle_source = gradle_path.read_text()
          gradle_source, version_code_count = re.subn(
              r"versionCode = \d+",
              f"versionCode = {os.environ['APP_VERSION_CODE']}",
              gradle_source,
              count=1,
          )
          gradle_source, version_name_count = re.subn(
              r'versionName = "[^"]+"',
              f'versionName = "{os.environ["APP_VERSION"]}"',
              gradle_source,
              count=1,
          )
          if version_code_count != 1 or version_name_count != 1:
              raise SystemExit("Pinned PakePlus version fields changed")

          # CI must never sign with the public PakePlus template identity.
          signing_block = re.compile(r'(?ms)^    signingConfigs \{.*?^    \}\n')
          gradle_source, removed = signing_block.subn('', gradle_source)
          if removed != 1:
              raise SystemExit("Pinned PakePlus signing block changed")
          gradle_source = re.sub(r'(?m)^\s*signingConfig = .*\n', '', gradle_source)
          if 'signingConfig' in gradle_source:
              raise SystemExit("Unexpected remaining signing configuration")
          Path("pakeplus.keystore").unlink(missing_ok=True)
          gradle_path.write_text(gradle_source)
          PY
          test -s app/src/main/assets/index.html
          find app/src/main/assets/assets -type f -name '*.js' -print -quit \
            | grep -q .
          jq -e \
            '
              .webUrl == "file:///android_asset/index.html"
              and .internet == true
              and .fullScreen == false
            ' \
            app/src/main/assets/app.json > /dev/null
          grep -Fq 'enableEdgeToEdge()' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq \
            'view.setPadding(systemBar.left, 0, systemBar.right, systemBar.bottom)' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'fun safeAreaTopCssPx(): Double' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'fun appVersion(): String' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'fun installApk(' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'MessageDigest.getInstance("SHA-256")' \
            app/src/main/java/com/app/pakeplus/AppUpdater.kt
          grep -Fq \
            'https://github.com/shaunsheepzzz/codexhost-mobile/releases/download/' \
            app/src/main/java/com/app/pakeplus/AppUpdater.kt
          grep -Fq 'canRequestPackageInstalls' \
            app/src/main/java/com/app/pakeplus/AppUpdater.kt
          grep -Fq 'codex-mobile-app-update' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq \
            "document.documentElement.style.setProperty('--native-safe-area-top'" \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq "applicationId = \"$APP_ID\"" app/build.gradle.kts
          grep -Fq "versionCode = $APP_VERSION_CODE" app/build.gradle.kts
          grep -Fq "versionName = \"$APP_VERSION\"" app/build.gradle.kts
          grep -Fq 'CodexHostMobile-update.apk' \
            app/src/main/java/com/app/pakeplus/AppUpdater.kt
          # AppUpdater.kt 里存的是「正则字面量」而不是真实版本号，所以这里必须用
          # grep -F：写成 grep -E 会让它去源码里找真正的数字，永远匹配不上，
          # 而 grep -q 又不打印任何东西，步骤就静默死在这里。
          grep -Fq 'CodexHostMobile-v\d+\.\d+\.\d+\.apk' \
            app/src/main/java/com/app/pakeplus/AppUpdater.kt
          grep -Fq 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' \
            app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.RECORD_AUDIO' \
            app/src/main/AndroidManifest.xml
          grep -Fq 'override fun onPermissionRequest' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'PermissionRequest.RESOURCE_AUDIO_CAPTURE' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'fun realtimeAudioStart()' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'android.media.AudioRecord' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq 'codex-mobile-realtime-audio' \
            app/src/main/java/com/app/pakeplus/MainActivity.kt
          grep -Fq '${applicationId}.fileprovider' \
            app/src/main/AndroidManifest.xml
          grep -Fq 'update_file_paths' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/xml/update_file_paths.xml
          if grep -Eq \
            'ACCESS_(FINE|COARSE)_LOCATION|EXTERNAL_STORAGE|READ_MEDIA|SYSTEM_ALERT_WINDOW|dataExtractionRules|fullBackupContent' \
            app/src/main/AndroidManifest.xml; then
            echo "::error::Android manifest contains an unnecessary capability"
            exit 1
          fi
          node "$RUNNER_TEMP/scan-mobile-assets.cjs" app/src/main/assets
          test ! -e pakeplus.keystore

      - name: Apply Android client certificate support
        run: python3 scripts/apply-android-mtls.py pakeplus

      - name: Test Android client certificate support
        working-directory: pakeplus
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK
        working-directory: pakeplus
        run: |
          ./gradlew assembleRelease --no-daemon
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Prepare and verify APK
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          # 本步骤大量断言是 grep -q / test -s / test -x：匹配不上时它们只会安静地以
          # 退出码 1 结束整个步骤，日志里不留任何线索。ERR 陷阱负责把真正失败的命令
          # 连同行号打出来，否则一次静默失败的排查成本极高。
          trap 'echo "::error::Prepare and verify APK failed at line $LINENO: $BASH_COMMAND" >&2' ERR
          mkdir -p "$RUNNER_TEMP/apk"
          artifact="$RUNNER_TEMP/apk/app-release-unsigned.apk"
          listing="$RUNNER_TEMP/apk/CodexHostMobile-contents.txt"
          final_manifest="$RUNNER_TEMP/apk/CodexHostMobile-manifest.xml"
          unpacked_assets="$RUNNER_TEMP/apk/CodexHostMobile-unpacked-assets"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$artifact"
          test -s "$artifact"
          unzip -l "$artifact" > "$listing"
          grep -Fq 'assets/index.html' "$listing"
          grep -Eq 'assets/assets/.+\.js' "$listing"
          apkanalyzer manifest print "$artifact" > "$final_manifest"
          python3 - "$final_manifest" <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          android = "http://schemas.android.com/apk/res/android"
          root = ET.parse(sys.argv[1]).getroot()
          dynamic_receiver_permission = (
              f"{os.environ['APP_ID']}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          )
          permissions = {
              element.get(f"{{{android}}}name", "")
              for element in root.findall("uses-permission")
          }
          allowed_permissions = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES",
              dynamic_receiver_permission,
          }
          if permissions != allowed_permissions:
              raise SystemExit(f"Unexpected final APK permissions: {sorted(permissions)}")
          permission_definitions = {
              element.get(f"{{{android}}}name", ""):
                  element.get(f"{{{android}}}protectionLevel", "")
              for element in root.findall("permission")
          }
          if (
              set(permission_definitions) != {dynamic_receiver_permission}
              or permission_definitions[dynamic_receiver_permission]
                  not in {"signature", "0x2"}
          ):
              raise SystemExit(
                  f"Unexpected final APK permission definitions: "
                  f"{permission_definitions}"
              )
          application = root.find("application")
          if application is None or application.get(f"{{{android}}}allowBackup") != "false":
              raise SystemExit("Final APK must disable application backup")
          providers = {
              element.get(f"{{{android}}}authorities", ""):
                  element.get(f"{{{android}}}exported", "")
              for element in application.findall("provider")
          }
          expected_provider = f"{os.environ['APP_ID']}.fileprovider"
          if providers.get(expected_provider) != "false":
              raise SystemExit(
                  f"Final APK is missing the private update provider: {providers}"
              )
          PY
          mkdir -p "$unpacked_assets"
          unzip -q "$artifact" 'assets/*' -d "$unpacked_assets"
          node "$RUNNER_TEMP/scan-mobile-assets.cjs" "$unpacked_assets/assets"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          if "$apksigner" verify "$artifact" >/dev/null 2>&1; then
            echo "Unexpected signed APK in unsigned CI build" >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP/apk" && sha256sum app-release-unsigned.apk > app-release-unsigned.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodexHostMobile-android-unsigned
          path: |
            ${{ runner.temp }}/apk/app-release-unsigned.apk
            ${{ runner.temp }}/apk/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 7
